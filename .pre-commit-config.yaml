# Install the git hook once per clone:  uv run pre-commit install
# Run against every file:               uv run pre-commit run --all-files
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      # Scans staged changes only; config is read from .gitleaks.toml.
      - id: gitleaks
