[project]
name = "glint"
version = "0.1.0"
description = "Simulate and lint GitLab CI pipelines: see which jobs run on a given branch, their fully-resolved scripts, and which variables are undefined."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
glint = "glint.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/glint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
